name: Build standalone desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements*.txt'
      - 'build.ps1'
      - 'prepare_engine.ps1'
      - 'packaging/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build-only dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-build.txt
      - name: Build Windows app
        shell: pwsh
        run: ./build.ps1
      - name: Test app without developer Python or Ghostscript
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'pdf-exe-check'
          $exe = (Resolve-Path 'dist/PDF简作.exe').Path
          $arguments = @('--self-check', ('"' + $testRoot + '"'))
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Self-check timeout' }
          if ($process.ExitCode -ne 0) { throw 'Self-check process failed' }
          $report = Get-Content (Join-Path $testRoot 'selfcheck.json') -Raw | ConvertFrom-Json
          if (-not $report.success -or -not $report.drag_drop_ready) { throw 'Self-check failed' }
          Copy-Item (Join-Path $testRoot 'selfcheck.json') 'dist/windows-selfcheck.json'
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File 'dist/windows-sha256.txt'
      - uses: actions/upload-artifact@v7
        with:
          name: PDF-jianzuo-Windows
          path: |
            dist/*.exe
            dist/windows-*.json
            dist/windows-sha256.txt
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install build-only dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check native architecture
        run: python -c "import platform; assert platform.machine() == '${{ matrix.arch }}'"
      - name: Compile bundled engine, build app, run isolated self-check and create DMG
        run: python packaging/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: PDF-jianzuo-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/macos-*-selfcheck.json
          if-no-files-found: error
